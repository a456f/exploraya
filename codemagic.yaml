workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Build iOS IPA
        script: |
          flutter clean
          flutter pub get
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          cd build/ios/ipa
          zip -r Runner.ipa.zip *.ipa
    artifacts:
      - build/ios/ipa/Runner.ipa.zip
